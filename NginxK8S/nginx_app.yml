apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: nginx-app
  namespace: argocd

spec:
  project: default
  source:
    repoURL: https://github.com/Aswin-Shine/argocdDemo.git
    targetRevision: main
    path: NginxK8S

  destination:
    server: https://172.31.23.114:33893
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      
